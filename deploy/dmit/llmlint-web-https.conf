server {
    listen 127.0.0.1:31445 ssl proxy_protocol;
    http2 on;
    server_name llmlint.notnotype.com;

    ssl_certificate /etc/v2ray-agent/tls/llmlint.notnotype.com.crt;
    ssl_certificate_key /etc/v2ray-agent/tls/llmlint.notnotype.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log /var/log/nginx/llmlint-access.log main;
    error_log /var/log/nginx/llmlint-error.log warn;

    location / {
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:3020;
    }
}
