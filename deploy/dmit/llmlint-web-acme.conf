server {
    listen 80;
    listen [::]:80;
    server_name llmlint.notnotype.com;

    access_log /var/log/nginx/llmlint-acme-access.log main;
    error_log /var/log/nginx/llmlint-acme-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/neuro-book-site-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
