# CI 仅验证并上传 Node/Nitro 生产构建产物；正式部署由 DMIT 发布流程负责。
name: Verify web build

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "skill/**"
      - "evals/report/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "skill/**"
      - "evals/report/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build web registry
        working-directory: web
        run: bun run build:registry
      - name: Root typecheck
        run: bun run typecheck
      - name: Web server typecheck
        working-directory: web
        run: bun run typecheck:server
      - name: Web typecheck
        working-directory: web
        run: bun run typecheck
      - name: Build Node server
        working-directory: web
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: llmlint-web-node-server
          path: web/.output
          if-no-files-found: error
          retention-days: 7
